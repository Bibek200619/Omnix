name: Secret guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  resend-secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test the guard
        run: python3 -m unittest scripts.secret_guard_test
      - name: Scan tracked files
        run: python3 scripts/secret_guard.py --staged
