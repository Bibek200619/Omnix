      - name: Deploy Backend
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            "${{ secrets.EC2_USERNAME }}@$EC2_HOST" << 'EOF'
              set -euo pipefail

              echo "Connected to $(hostname) as $(whoami)"

              cd ~/Omnix

              git fetch origin main
              git pull --ff-only origin main

              cd backend

              source venv/bin/activate

              sudo -n systemctl restart omnix
              sudo -n systemctl status omnix --no-pager -l

              curl -f http://localhost:8000/health/live
          EOF