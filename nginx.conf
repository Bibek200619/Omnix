worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    # Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Upstream Backend
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        # Render this file from OMNIX_SERVER_IP / deployment hostnames.
        include /etc/nginx/conf.d/omnix-server-name*.conf;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        # Render this file from OMNIX_SERVER_IP / deployment hostnames.
        include /etc/nginx/conf.d/omnix-server-name*.conf;

        # Let's Encrypt certificates must be provisioned by certbot and mounted read-only.
        ssl_certificate /etc/letsencrypt/live/omnix/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/omnix/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Increase body size for file uploads
        client_max_body_size 50M;

        location = /chat/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming / SSE Support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ ^/conversations/[^/]+/messages/stream$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming / SSE Support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Websocket Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Streaming / SSE Support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        
        # Admin / Ops Routes
        location /admin/ {
            allow 127.0.0.1;
            allow ::1;
            # Render additional allow directives from OMNIX_ADMIN_ALLOWED_IPS.
            include /etc/nginx/conf.d/omnix-admin-allow*.conf;
            deny all;

            proxy_pass http://backend/admin/;
            proxy_set_header Host $host;
        }

        # Health checks
        location /health/ {
            proxy_pass http://backend/health/;
            proxy_set_header Host $host;
        }
    }
}
