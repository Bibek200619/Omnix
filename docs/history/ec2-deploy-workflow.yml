name: Deploy Omnix Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd ~/Omnix

            git fetch origin
            git reset --hard origin/main

            cd backend

            source venv/bin/activate

            pip install -r requirements.txt --quiet

            # Install the dedicated PDF/OCR consumer, including on existing hosts.
            sudo install -m 0644 ../scripts/omnix-ocr-worker.service /etc/systemd/system/omnix-ocr-worker.service
            sudo systemctl daemon-reload
            sudo systemctl enable omnix-ocr-worker

            # Restart API process
            sudo systemctl restart omnix

            # Restart ingestion worker (consumes ingest_file jobs from Redis)
            sudo systemctl restart omnix-ingestion-worker

            # PDF jobs use a separate queue and require their own worker.
            sudo systemctl restart omnix-ocr-worker

            # Restart automation scheduler (periodic workspace automations)
            sudo systemctl restart omnix-automation-scheduler

            sleep 5

            sudo systemctl is-active --quiet omnix-ocr-worker

            echo "Deployment completed successfully"
