version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - omnix-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--proxy-headers", "--timeout-graceful-shutdown", "30"]
    stop_grace_period: 45s
    environment:
      OMNIX_ROLE: api
      OMNIX_UPLOAD_DIR: /app/uploads
      OMNIX_FILE_STORAGE_SHARED: "true"
    env_file:
      - .env.production
    expose:
      - "8000"
    volumes:
      - omnix_uploads:/app/uploads
    networks:
      - omnix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ingestion worker: consumes ingest_file jobs from Redis queue.
  # MUST run separately from the API and automation-scheduler.
  ingestion-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      OMNIX_ROLE: ingestion_worker
      OMNIX_UPLOAD_DIR: /app/uploads
      OMNIX_FILE_STORAGE_SHARED: "true"
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
    volumes:
      - omnix_uploads:/app/uploads
    networks:
      - omnix-network

  # Dedicated, bounded PDF/OCR capacity. The worker role selects OMNIX_OCR_JOB_QUEUE.
  ocr-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      OMNIX_ROLE: ocr_worker
      OMNIX_WORKER_ID: ocr_worker_main
      OMNIX_UPLOAD_DIR: /app/uploads
      OMNIX_FILE_STORAGE_SHARED: "true"
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
    volumes:
      - omnix_uploads:/app/uploads
    networks:
      - omnix-network

  # Automation scheduler: runs periodic workspace automations (presence cleanup, etc.)
  automation-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "app.automation.scheduler"]
    environment:
      OMNIX_ROLE: automation_scheduler
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
    networks:
      - omnix-network

networks:
  omnix-network:
    driver: bridge

volumes:
  omnix_uploads:
